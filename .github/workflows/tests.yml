name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    # The pipeline and the skill script, with no third-party packages, no
    # provider keys and no network. The app tests skip here.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v

  app:
    # The Gradio wrapper, with the pinned requirements installed. No Space is
    # launched and no provider is called.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
